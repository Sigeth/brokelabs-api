# cargo deny check — dependency policy (D14: MIT-compatible licenses only).

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
yanked = "deny"
# jsonwebtoken's rust_crypto backend compiles every algorithm family. BrokeLabs
# access tokens are EdDSA (Ed25519) only; Verifier rejects any other "alg".
# OIDC ID tokens (openidconnect) are often RS256, but only verified with the
# provider's public keys: the Marvin attack needs private-key operations
# (decryption), which never happen here. Revisit when upgrading.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin attack): no RSA private key is used; ID tokens are only verified" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via p256/p384: ECDSA keys are never used" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, transitive via openidconnect and oauth2: re-check at each openidconnect upgrade" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The shared crates are consumed from their git tags until published to crates.io.
allow-git = ["https://github.com/Sigeth/brokelabs-core-rs"]
