[package]
name = "opslab-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.23"
futures = "0.3"
k8s-openapi = { version = "0.29", default-features = false, features = ["std", "v1_34"] }
kube = { version = "5", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
opslab-auth = { git = "https://github.com/Sigeth/opslab-core-rs", tag = "v0.4.0", version = "0.1" }
opslab-types = { git = "https://github.com/Sigeth/opslab-core-rs", tag = "v0.4.0", version = "0.1" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "derive", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Smaller images: no symbols in release binaries.
strip = true
